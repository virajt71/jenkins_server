---
- name: Create Jenkins jobs and secrets
  hosts: all
  become: true
  vars_files:
    - /vault/secrets.yml
  vars:
    jenkins_port: 8080
    jenkins_url: "http://localhost:{{ jenkins_port }}"

  tasks:
    - name: Get initial Jenkins admin password
      ansible.builtin.slurp:
        src: /var/lib/jenkins/secrets/initialAdminPassword
      register: admin_pass_encoded

    - name: Decode admin password
      ansible.builtin.set_fact:
        jenkins_admin_pass: "{{ admin_pass_encoded.content | b64decode | trim }}"

    - name: Generate Jenkins API token
      community.general.jenkins_credential:
        id: "ansible-api-token"
        name: "Ansible Automation Token"
        jenkins_user: "admin"
        jenkins_password: "{{ jenkins_admin_pass }}"
        type: "token"
        url: "{{ jenkins_url }}"
      register: token_result
      failed_when: false # Don't fail immediately, let's check the result

    - name: Store generated token as fact
      ansible.builtin.set_fact:
        jenkins_token: "{{ token_result.token }}"
      when: token_result.token is defined

    - name: Add Azure Subscription ID as Jenkins secret text
      community.general.jenkins_credential:
        id: "azure_subscription_id"
        description: "Azure Subscription ID for pipelines"
        type: "text"
        secret: "{{ azure_subscription_id }}"
        token: "{{ jenkins_token }}"
        jenkins_user: "admin"
        url: "{{ jenkins_url }}"

    - name: Add Azure Subscription ID as Jenkins secret text
      community.general.jenkins_credential:
        id: "azure_tenant_id"
        description: "Azure Subscription ID for pipelines"
        type: "text"
        secret: "{{ azure_tenant_id }}"
        token: "{{ jenkins_token }}"
        jenkins_user: "admin"
        url: "{{ jenkins_url }}"

    - name: Add Azure Subscription ID as Jenkins secret text
      community.general.jenkins_credential:
        id: "azure_client_id"
        description: "Azure Subscription ID for pipelines"
        type: "text"
        secret: "{{ azure_client_id }}"
        token: "{{ jenkins_token }}"
        jenkins_user: "admin"
        url: "{{ jenkins_url }}"

    - name: Add Azure Subscription ID as Jenkins secret text
      community.general.jenkins_credential:
        id: "azure_client_password"
        description: "Azure Subscription ID for pipelines"
        type: "text"
        secret: "{{ azure_client_password }}"
        token: "{{ jenkins_token }}"
        jenkins_user: "admin"
        url: "{{ jenkins_url }}"
