---
- name: Install Terragrunt
  hosts: all
  become: true

  vars:
    terragrunt_install_dir: /usr/local/bin
    terragrunt_binary: terragrunt
    terragrunt_os: linux
    terragrunt_arch: amd64

  tasks:
    - name: Get latest Terragrunt version
      uri:
        url: https://api.github.com/repos/gruntwork-io/terragrunt/releases/latest
        return_content: true
      register: terragrunt_release

    - name: Set Terragrunt version
      set_fact:
        terragrunt_version: "{{ terragrunt_release.json.tag_name }}"

    - name: Download Terragrunt binary
      get_url:
        url: "https://github.com/gruntwork-io/terragrunt/releases/download/{{ terragrunt_version }}/terragrunt_{{ terragrunt_os }}_{{ terragrunt_arch }}"
        dest: "{{ terragrunt_install_dir }}/{{ terragrunt_binary }}"
        mode: "0755"

    - name: Verify Terragrunt installation
      command: terragrunt --version
      register: tg_version

    - debug:
        msg: "Terragrunt installed successfully: {{ tg_version.stdout }}"
